[workspace]
members = ["sdk", "games/dust"]

[package]
name = "fps16"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["serialize", "wav"] }
dust = { path = "games/dust" }
postcard = { version = "1.1.3", features = ["use-std"] }
sdk = { path = "sdk" }
serde = { version = "1.0.229", features = ["derive"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }

[profile.dev.package."*"]
opt-level = 3

