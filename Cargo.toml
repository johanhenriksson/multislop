[workspace]
members = ["sdk", "games/dust", "games/arena", "games/race"]

[package]
name = "fps16"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["serialize", "wav", "system_font_discovery"] }
postcard = { version = "1.1.3", features = ["use-std"] }
sdk = { path = "sdk" }
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
# The wasm test compares the module against the same game linked in natively.
dust = { path = "games/dust" }

[profile.dev.package."*"]
opt-level = 3

